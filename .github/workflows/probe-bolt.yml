name: probe-bolt
true:
  workflow_dispatch: null
  push:
    tags:
    - v*
permissions:
  contents: write
env:
  OMP_TAG: v18.12.6
  PIBOLT_TAG: bolt-v1.2.1
  BUN: 1.4.5
  OMP_REPO: https://github.com/can1357/oh-my-pi
jobs:
  bolt:
    name: omp-bolt (Pi-Bolt AOT, glibc)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN }}
    - uses: dtolnay/rust-toolchain@stable
    - name: Fetch Pi-Bolt runtime
      run: "curl -fsSL -o bolt.tar.gz \\\n  \"https://github.com/opensec-git/Pi-Bolt/releases/download/$PIBOLT_TAG/pi-bolt-runtime-linux-arm64.tar.gz\"\
        \nmkdir -p runtime\ntar -xzf bolt.tar.gz -C runtime\nPIBOLT_BUN=\"$PWD/runtime/pi-bolt-runtime-linux-arm64/bun\"\
        \ntest -x \"$PIBOLT_BUN\"\n\"$PIBOLT_BUN\" --version\n"
    - name: Clone upstream ${{ env.OMP_TAG }}
      run: git clone --depth=1 --branch "$OMP_TAG" "$OMP_REPO" upstream
    - name: Apply patches
      env:
        OMP_SRC: ${{ github.workspace }}/upstream
      run: bash termux/apply-patches.sh
    - name: Install dependencies and generate sources
      working-directory: upstream
      run: 'bun install --frozen-lockfile

        bun run gen:stats

        bun run gen:tool-views

        '
    - name: Build glibc addon
      env:
        OUT: ${{ github.workspace }}/out
      run: "set -euo pipefail\nexport CMAKE_POLICY_VERSION_MINIMUM=3.5\nexport PCRE2_SYS_STATIC=1\n\
        mkdir -p \"$OUT\"\ncd crates\nnpx --yes --package @napi-rs/cli@3.7.2 napi\
        \ build \\\n  --manifest-path pi-natives/Cargo.toml \\\n  --package-json-path\
        \ ../packages/natives/package.json \\\n  --platform --no-js --dts index.d.ts\
        \ -o \"$OUT\" --profile local\nADDON=\"$OUT/pi_natives.linux-arm64.node\"\n\
        if [ ! -f \"$ADDON\" ]; then\n  shopt -s nullglob\n  candidates=(\"$OUT\"\
        /pi_natives.*arm64*.node)\n  shopt -u nullglob\n  [ \"${#candidates[@]}\"\
        \ -eq 1 ]\n  mv \"${candidates[0]}\" \"$ADDON\"\nfi\nllvm-strip --strip-unneeded\
        \ \"$ADDON\" 2>/dev/null || strip --strip-unneeded \"$ADDON\"\ncd .. && bun\
        \ scripts/stamp-native-version.ts \"$ADDON\"\n"
    - name: Compile AOT image
      env:
        OMP_SRC: ${{ github.workspace }}/upstream
        OUT: ${{ github.workspace }}/out/omp-bolt
        PIBOLT_BUN: ${{ github.workspace }}/runtime/pi-bolt-runtime-linux-arm64/bun
        BUN_STATIC_HEAP: '1'
        BUN_AOT: '1'
        BUN_AOT_JIT: '0'
        BUN_AOT_CPU: baseline
        BUN_JSC_omitBytecodeFromStaticHeap: '1'
        BUN_JSC_useAOTLoopSplitting: '1'
        BUN_JSC_aotLoopSplittingPolicy: '5'
      run: "set -euo pipefail\nENTRYPOINTS=\"$(python3 - \"$OMP_SRC/packages/coding-agent/src\"\
        \ <<'PY'\nimport os, re, sys\nroot = sys.argv[1]\npat = re.compile(r'new URL\\\
        (\"(\\./[^\"]*worker[^\"]*\\.ts)\", import\\.meta\\.url\\)')\nfound = set()\n\
        for d, _, fs in os.walk(root):\n    for f in fs:\n        if not f.endswith(\"\
        .ts\"):\n            continue\n        p = os.path.join(d, f)\n        with\
        \ open(p, encoding=\"utf-8\", errors=\"ignore\") as fh:\n            for rel\
        \ in pat.findall(fh.read()):\n                found.add(os.path.normpath(os.path.join(d,\
        \ rel)))\nprint(\"\\n\".join(sorted(found)))\nPY\n)\"\nif [ -n \"$ENTRYPOINTS\"\
        \ ]; then\n  echo \"$ENTRYPOINTS\" | sed 's/^/entrypoint: /'\nelse\n  echo\
        \ \"no worker modules detected; workers stay interpreted\"\nfi\nexport OMP_ENTRYPOINTS=\"\
        $ENTRYPOINTS\"\n\"$PIBOLT_BUN\" termux/build-bolt.ts\n"
    - name: Verify AOT image
      env:
        BUN_STATIC_HEAP_VERBOSE: '1'
      run: 'set -euo pipefail

        ./out/omp-bolt --version 2>&1 | tee /tmp/bolt.log

        grep -q ''mapped: true'' /tmp/bolt.log

        grep -q ''image registered: true'' /tmp/bolt.log

        grep -q ''^omp/18\.12\.6$'' /tmp/bolt.log

        ! grep -qi ''running from bytecode'' /tmp/bolt.log

        '
    - name: Package
      run: 'set -euo pipefail

        cd out

        sha256sum omp-bolt pi_natives.linux-arm64.node > SHA256SUMS

        cp ../termux/omp-bolt omp-bolt-launcher

        chmod +x omp-bolt-launcher

        cp ../termux/install-bolt.sh .

        zip -j "$GITHUB_WORKSPACE/omp-bolt-termux-aarch64.zip" ./*

        '
    - uses: actions/upload-artifact@v4
      with:
        name: omp-bolt-termux-aarch64
        path: omp-bolt-termux-aarch64.zip
        if-no-files-found: error
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: omp-bolt-termux-aarch64.zip
'on':
  workflow_dispatch: null
