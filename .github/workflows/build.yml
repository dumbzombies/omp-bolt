name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  OMP_TAG: v18.12.6
  PIBOLT_TAG: bolt-v1.2.1
  BUN: 1.4.5
  OMP_REPO: https://github.com/can1357/oh-my-pi

jobs:
  android:
    name: omp (bionic, stock Bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-06
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Clone upstream ${{ env.OMP_TAG }}
        run: git clone --depth=1 --branch "$OMP_TAG" "$OMP_REPO" upstream

      - name: Apply patches
        env:
          OMP_SRC: ${{ github.workspace }}/upstream
        run: bash termux/apply-patches.sh

      - name: Install dependencies and generate sources
        working-directory: upstream
        run: |
          bun install --frozen-lockfile
          bun run gen:stats
          bun run gen:tool-views

      - name: Build bionic addon
        env:
          OMP_SRC: ${{ github.workspace }}/upstream
          OUT: ${{ github.workspace }}/out
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash termux/build-native-android.sh

      - name: Compile omp binary
        env:
          OMP_SRC: ${{ github.workspace }}/upstream
          OUT: ${{ github.workspace }}/out
        run: bun termux/build-omp-android.ts

      - name: Verify artifacts
        env:
          OMP_SRC: ${{ github.workspace }}/upstream
          OUT: ${{ github.workspace }}/out
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash termux/verify-artifacts.sh

      - name: Package
        run: |
          cd out
          sha256sum omp.bin pi_natives.android-arm64.node > SHA256SUMS
          cp ../termux/omp ../termux/install.sh .
          zip -j "$GITHUB_WORKSPACE/omp-termux-aarch64.zip" ./*

      - uses: actions/upload-artifact@v4
        with:
          name: omp-termux-aarch64
          path: omp-termux-aarch64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: omp-termux-aarch64.zip

  bolt:
    name: omp-bolt (Pi-Bolt AOT, glibc)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch Pi-Bolt runtime
        run: |
          curl -fsSL -o bolt.tar.gz \
            "https://github.com/opensec-git/Pi-Bolt/releases/download/$PIBOLT_TAG/pi-bolt-runtime-linux-arm64.tar.gz"
          mkdir -p runtime
          tar -xzf bolt.tar.gz -C runtime
          PIBOLT_BUN="$PWD/runtime/pi-bolt-runtime-linux-arm64/bun"
          test -x "$PIBOLT_BUN"
          "$PIBOLT_BUN" --version

      - name: Clone upstream ${{ env.OMP_TAG }}
        run: git clone --depth=1 --branch "$OMP_TAG" "$OMP_REPO" upstream

      - name: Apply patches
        env:
          OMP_SRC: ${{ github.workspace }}/upstream
        run: bash termux/apply-patches.sh

      - name: Install dependencies and generate sources
        working-directory: upstream
        run: |
          bun install --frozen-lockfile
          bun run gen:stats
          bun run gen:tool-views

      - name: Build glibc addon
        env:
          OMP_SRC: ${{ github.workspace }}/upstream
          OUT: ${{ github.workspace }}/out
        run: |
          set -euo pipefail
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export PCRE2_SYS_STATIC=1
          mkdir -p "$OUT"
          cd "$OMP_SRC/crates"
          npx --yes --package @napi-rs/cli@3.7.2 napi build \
            --manifest-path pi-natives/Cargo.toml \
            --package-json-path ../packages/natives/package.json \
            --platform --no-js --dts index.d.ts -o "$OUT" --profile local
          ADDON="$OUT/pi_natives.linux-arm64.node"
          if [ ! -f "$ADDON" ]; then
            shopt -s nullglob
            candidates=("$OUT"/pi_natives.*arm64*.node)
            shopt -u nullglob
            [ "${#candidates[@]}" -eq 1 ]
            mv "${candidates[0]}" "$ADDON"
          fi
          llvm-strip --strip-unneeded "$ADDON" 2>/dev/null || strip --strip-unneeded "$ADDON"
          cd .. && bun scripts/stamp-native-version.ts "$ADDON"

      - name: Compile AOT image
        env:
          OMP_SRC: ${{ github.workspace }}/upstream
          OUT: ${{ github.workspace }}/out/omp-bolt
          PIBOLT_BUN: ${{ github.workspace }}/runtime/pi-bolt-runtime-linux-arm64/bun
          BUN_STATIC_HEAP: "1"
          BUN_AOT: "1"
          BUN_AOT_JIT: "0"
          BUN_AOT_CPU: baseline
          BUN_JSC_omitBytecodeFromStaticHeap: "1"
          BUN_JSC_useAOTLoopSplitting: "1"
          BUN_JSC_aotLoopSplittingPolicy: "5"
        run: |
          set -euo pipefail
          ENTRYPOINTS="$(python3 - "$OMP_SRC/packages/coding-agent/src" <<'PY'
          import os, re, sys
          root = sys.argv[1]
          pat = re.compile(r'new URL\("(\./[^"]*worker[^"]*\.ts)", import\.meta\.url\)')
          found = set()
          for d, _, fs in os.walk(root):
              for f in fs:
                  if not f.endswith(".ts"):
                      continue
                  p = os.path.join(d, f)
                  with open(p, encoding="utf-8", errors="ignore") as fh:
                      for rel in pat.findall(fh.read()):
                          found.add(os.path.normpath(os.path.join(d, rel)))
          print("\n".join(sorted(found)))
          PY
          )"
          if [ -n "$ENTRYPOINTS" ]; then
            echo "$ENTRYPOINTS" | sed 's/^/entrypoint: /'
          else
            echo "no worker modules detected; workers stay interpreted"
          fi
          export OMP_ENTRYPOINTS="$ENTRYPOINTS"
          "$PIBOLT_BUN" termux/build-bolt.ts

      - name: Verify AOT image
        env:
          BUN_STATIC_HEAP_VERBOSE: "1"
        run: |
          set -euo pipefail
          ./out/omp-bolt --version 2>&1 | tee /tmp/bolt.log
          grep -q 'mapped: true' /tmp/bolt.log
          grep -q 'image registered: true' /tmp/bolt.log
          grep -q '^omp/18\.12\.6$' /tmp/bolt.log
          ! grep -qi 'running from bytecode' /tmp/bolt.log

      - name: Package
        run: |
          set -euo pipefail
          cd out
          sha256sum omp-bolt pi_natives.linux-arm64.node > SHA256SUMS
          cp ../termux/omp-bolt omp-bolt-launcher
          chmod +x omp-bolt-launcher
          cp ../termux/install-bolt.sh .
          zip -j "$GITHUB_WORKSPACE/omp-bolt-termux-aarch64.zip" ./*

      - uses: actions/upload-artifact@v4
        with:
          name: omp-bolt-termux-aarch64
          path: omp-bolt-termux-aarch64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: omp-bolt-termux-aarch64.zip

